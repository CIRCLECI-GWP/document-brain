version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: uv sync --locked

      - run:
          name: Run tests
          command: uv run pytest tests/ -v

      - run:
          name: Build package
          command: uv build

      - persist_to_workspace:
          root: .
          paths:
            - dist

  inspect:
    docker:
      - image: cimg/python:3.14-node
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: uv sync --locked

      - run:
          name: Check the tools with the MCP Inspector CLI
          command: |
            npx --yes @modelcontextprotocol/inspector@2.15.0 --cli \
              uv run mcp-document-brain \
              --method tools/list --format json > tools.json
            jq -e --argjson want '["read_any_document","save_file_to_pc"]' \
              '[.result.tools[].name] as $have | $want - $have | length == 0' tools.json

      - run:
          name: Call read_any_document with the MCP Inspector CLI
          command: |
            npx --yes @modelcontextprotocol/inspector@2.15.0 --cli \
              uv run mcp-document-brain \
              --method tools/call --tool-name read_any_document \
              --tool-args-json '{"file_path": "README.md"}' --format json > read.json
            jq -e '.result.content[0].text | test("MCP Document Reader")' read.json

  publish:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Publish to PyPI
          command: uv publish

workflows:
  build-test-publish:
    jobs:
      - build:
          filters: pipeline.git.branch or (pipeline.git.tag matches /^v.*/)
      - inspect:
          filters: pipeline.git.branch or (pipeline.git.tag matches /^v.*/)
      - publish:
          requires:
            - build
            - inspect
          filters: pipeline.git.tag matches /^v.*/
