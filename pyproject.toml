[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-document-brain-circlci"
version = "0.2.0"
description = "MCP server for converting files to markdown using Markitdown"
readme = "README.md"
authors = [
    {name = "Armstrong Asenavi", email = "zattufinancialanlyst@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2,<5",
    "markitdown[all]>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
]

[project.scripts]
mcp-document-brain = "document_brain.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
